<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Complaint</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.1/jquery.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.0/js/bootstrap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Submit a Complaint</h2>
        <p style="color: gray; font-size: 14px;">Your submission is completely anonymous.</p>
        
        <form id="complaintForm" onsubmit="submitComplaint(event)">
            <label for="categoryInput">Category:</label>
            <select id="categoryInput" required>
                <option value="Security">Security</option>
                <option value="Harassment">Harassment</option>
                <option value="Corruption">Corruption</option>
                <option value="Technical">Technical</option>
                <option value="Other">Other</option>
            </select>

            <label for="descInput">Description:</label>
            <textarea id="descInput" required placeholder="What happened?"></textarea>

            <label for="urlInput">Evidence URL (Optional):</label>
            <input type="url" id="urlInput" placeholder="https://..." />

            <button class="btn btn-info type="submit">Submit Complaint</button>
        </form>

        <div id="submissionResult" class="result-box"></div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">
        
        <!-- Navigation Button -->
        <button class="nav-btn" onclick="goToCheckStatus()">Check Existing Complaint</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
