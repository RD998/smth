<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Status</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h2>Check Complaint Status</h2>
        <p style="color: gray; font-size: 14px;">Enter your hex code below to see updates.</p>
        
        <label for="hexInput">Hex Code:</label>
        <input type="text" id="hexInput" placeholder="e.g. e19e9a09c57f94d1" required />

        <button onclick="checkStatus()">Check Status</button>

        <div id="resultBox" class="result-box"></div>

        <hr style="margin: 25px 0; border: 0; border-top: 1px solid #eee;">
        
        <!-- Navigation Button -->
        <button class="nav-btn" onclick="goToSubmit()">Back to Submit Complaint</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
