<html><head><title>Path Finder</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>Path Finder</h1>
    <h3>Welcome</h3><h3 id="username"></h3>
    <form>
        <h3>Enter your preferred language</h3>
        <select id="language1">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
            <option value="hi">Hindi</option>
        </select>
        <h3>Enter Accesibilities you want to include</h3>
        <input type="checkbox" name="accessibility" id="accessibility" value="wheelchair"> Wheelchair Accessible<br>
        <input type="checkbox" name="accessibility" id="accessibility" value="braille"> Braille Signage<br>
        <input type="checkbox" name="accessibility" id="accessibility" value="audio"> Audio Assistance<br>
        
        <button type="button" class="btn btn-success" onclick="Preferences()">Submit</button>
    </form><script>
   
        window.onload = showCustomPrompt();</script>
        <style>
        body {
            opacity: 0;
            animation: fade-in 4s forwards;

        }

        @keyframes fade-in {
            from {
                opacity: 0;
            }

            to {
                opacity: 1;
            }
        }
    </style>
    <script src="main.js" defer></script>
</body>
</html>
