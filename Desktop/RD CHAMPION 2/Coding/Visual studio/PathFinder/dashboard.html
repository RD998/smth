<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vital Path - User Dashboard</title>
    <style>
        :root {
            --primary-blue: #0A58CA;
            --primary-hover: #084298;
            --light-blue: #E9F2FF;
            --danger-red: #DC2626;
            --danger-hover: #B91C1C;
            --light-red: #FEF2F2;
            --text-dark: #1E293B;
            --text-muted: #64748B;
            --bg-light: #F8FAFC;
            --white: #FFFFFF;
            --card-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.03);
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, var(--bg-light) 0%, #E2E8F0 100%);
            background-attachment: fixed;
            color: var(--text-dark);
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }

        header {
            background-color: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 20px 40px;
            box-shadow: 0 1px 3px 0 rgba(0, 0, 0, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-title {
            font-size: 24px;
            font-weight: 800;
            color: var(--primary-blue);
            margin: 0;
        }

        .book-new-btn {
            background: var(--primary-blue);
            border: none;
            color: var(--white);
            padding: 10px 24px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 15px;
            transition: all 0.3s ease;
        }

        .book-new-btn:hover {
            background: var(--primary-hover);
        }

        main {
            max-width: 800px;
            margin: 40px auto;
            padding: 0 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }

        h2 {
            font-size: 32px;
            font-weight: 700;
            margin: 0;
            color: var(--text-dark);
        }

        .dashboard-container {
            background: var(--white);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--card-shadow);
            width: 100%;
            box-sizing: border-box;
            border: 1px solid rgba(255, 255, 255, 0.5);
        }

        .booked-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
        }

        .booked-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 20px;
            background: var(--bg-light);
            border: 1px solid #E2E8F0;
            border-radius: 12px;
        }

        .booked-info {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .booked-time {
            font-size: 16px;
            font-weight: 700;
            color: var(--text-dark);
        }

        .booked-meta {
            font-size: 13px;
            color: var(--text-muted);
        }

        .cancel-btn {
            background: var(--light-red);
            color: var(--danger-red);
            border: 1px solid var(--danger-red);
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .cancel-btn:hover {
            background: var(--danger-red);
            color: var(--white);
        }
    </style>
</head>
<body>
    <header>
        <h1 class="header-title">Vital Path</h1>
        <button class="book-new-btn" onclick="Start_Booking()" id="book-appointment-btn">Book Appointment</button>
    </header>

    <main>
        <h2>Your Booked Slots</h2>
        <div class="dashboard-container">
            <div class="booked-list" id="booked-container"></div>
        </div>
    </main>

    <script src="main.js"></script>
    <script>Load_Dashboard();</script>
</body>
</html>
